spring.application.name=${SPRING_APPLICATION_NAME:CyberShieldAI}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cybershield?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin

app.security.jwt.secret=${JWT_SECRET:CyberShieldAI-Change-This-Secret-In-Production-At-Least-64-Characters}
app.security.jwt.access-token-expiration-minutes=${JWT_ACCESS_MINUTES:30}
app.security.jwt.refresh-token-expiration-days=${JWT_REFRESH_DAYS:7}

app.mail.from=${MAIL_FROM:mankardevendra33@gmail.com}
app.mail.enabled=${MAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true

app.security.session-block.base-url=${SESSION_BLOCK_BASE_URL:http://localhost:8080}
app.security.session-block.expiration-minutes=${SESSION_BLOCK_EXPIRATION_MINUTES:30}